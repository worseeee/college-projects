<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统用户注册</title>
    <style>
        /* ================= 基础重置与页面排版 ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* ================= 卡片式表单容器 ================= */
        .register-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .register-title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        /* 成功提示框（默认隐藏） */
        .success-alert {
            display: none;
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
            font-size: 14px;
        }

        /* ================= 表单项布局 ================= */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            transition: all 0.3s ease;
            outline: none;
        }

        /* 输入框高亮状态 */
        .form-group input:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        /* 输入框错误状态 */
        .form-group input.input-error {
            border-color: #e74c3c;
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.1);
        }

        /* 错误提示文字（默认隐藏） */
        .error-msg {
            display: none;
            color: #e74c3c;
            font-size: 12px;
            margin-top: 6px;
        }

        /* ================= 按钮布局 ================= */
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: bold;
        }

        .btn-submit {
            background-color: #3498db;
            color: white;
        }

        .btn-submit:hover {
            background-color: #2980b9;
        }

        .btn-reset {
            background-color: #ecf0f1;
            color: #7f8c8d;
        }

        .btn-reset:hover {
            background-color: #bdc3c7;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <h2 class="register-title">系统账号注册</h2>
        
        <div id="successAlert" class="success-alert">
            🎉 注册成功！即将为您跳转...
        </div>

        <form id="registerForm" novalidate>
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" placeholder="4-16位字母、数字或下划线" autocomplete="off">
                <div class="error-msg" id="error-username"></div>
            </div>

            <div class="form-group">
                <label for="password">登录密码</label>
                <input type="password" id="password" placeholder="至少输入 6 位密码">
                <div class="error-msg" id="error-password"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">确认密码</label>
                <input type="password" id="confirmPassword" placeholder="请再次输入密码">
                <div class="error-msg" id="error-confirmPassword"></div>
            </div>

            <div class="form-group">
                <label for="phone">手机号码</label>
                <input type="tel" id="phone" placeholder="请输入 11 位手机号码">
                <div class="error-msg" id="error-phone"></div>
            </div>

            <div class="form-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" placeholder="请输入规范的邮箱地址">
                <div class="error-msg" id="error-email"></div>
            </div>

            <div class="btn-group">
                <button type="reset" class="btn-reset">重置表单</button>
                <button type="submit" class="btn-submit">立即注册</button>
            </div>
        </form>
    </div>

    <script>
        /**
         * 获取所有的 DOM 节点
         */
        const form = document.getElementById('registerForm');
        const successAlert = document.getElementById('successAlert');
        
        // 提取需要验证的输入框节点
        const inputs = {
            username: document.getElementById('username'),
            password: document.getElementById('password'),
            confirmPassword: document.getElementById('confirmPassword'),
            phone: document.getElementById('phone'),
            email: document.getElementById('email')
        };

        /**
         * 辅助函数：显示单个输入框的错误
         */
        function showError(inputId, message) {
            const inputEl = inputs[inputId];
            const errorEl = document.getElementById('error-' + inputId);
            
            inputEl.classList.add('input-error');
            errorEl.innerText = message;
            errorEl.style.display = 'block';
        }

        /**
         * 辅助函数：清除单个输入框的错误
         */
        function clearError(inputId) {
            const inputEl = inputs[inputId];
            const errorEl = document.getElementById('error-' + inputId);
            
            inputEl.classList.remove('input-error');
            errorEl.innerText = '';
            errorEl.style.display = 'none';
        }

        /**
         * 辅助函数：清除所有表单错误样式
         */
        function clearAllErrors() {
            Object.keys(inputs).forEach(key => clearError(key));
            successAlert.style.display = 'none';
        }

        /**
         * 核心逻辑：拦截表单提交并执行全面验证
         */
        form.addEventListener('submit', function(event) {
            // 阻止浏览器默认的提交行为，由 JS 完全接管
            event.preventDefault();
            
            // 每次提交前先清空之前的错误状态
            clearAllErrors();

            let isValid = true;
            let firstErrorInput = null; // 用于记录第一个报错的输入框，以便于后续 focus

            // 获取用户输入的实时值，并去除首尾空格
            const values = {
                username: inputs.username.value.trim(),
                password: inputs.password.value.trim(),
                confirmPassword: inputs.confirmPassword.value.trim(),
                phone: inputs.phone.value.trim(),
                email: inputs.email.value.trim()
            };

            // 规则验证定义区
            const rules = [
                {
                    id: 'username',
                    check: () => {
                        if (!values.username) return "用户名不能为空";
                        if (!/^\w{4,16}$/.test(values.username)) return "用户名必须为 4 到 16 位，且只能包含字母、数字或下划线";
                        return null;
                    }
                },
                {
                    id: 'password',
                    check: () => {
                        if (!values.password) return "密码不能为空";
                        if (values.password.length < 6) return "密码长度必须至少为 6 位";
                        return null;
                    }
                },
                {
                    id: 'confirmPassword',
                    check: () => {
                        if (!values.confirmPassword) return "请再次输入密码以确认";
                        if (values.confirmPassword !== values.password) return "两次输入的密码不一致";
                        return null;
                    }
                },
                {
                    id: 'phone',
                    check: () => {
                        if (!values.phone) return "手机号码不能为空";
                        if (!/^1[3-9]\d{9}$/.test(values.phone)) return "请输入有效的 11 位手机号码";
                        return null;
                    }
                },
                {
                    id: 'email',
                    check: () => {
                        if (!values.email) return "邮箱不能为空";
                        // 经典标准邮箱正则
                        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(values.email)) return "请输入正确的邮箱格式（例如：student@example.com）";
                        return null;
                    }
                }
            ];

            // 遍历执行所有规则验证
            rules.forEach(rule => {
                const errorMessage = rule.check();
                if (errorMessage) {
                    isValid = false;
                    showError(rule.id, errorMessage);
                    // 记录第一个发生错误的 DOM 元素
                    if (!firstErrorInput) {
                        firstErrorInput = inputs[rule.id];
                    }
                }
            });

            // 结果判定分流
            if (!isValid) {
                // 如果验证失败，焦点自动定位到第一个出错的位置
                firstErrorInput.focus();
            } else {
                // 验证全部通过
                successAlert.style.display = 'block';
                console.log("前端校验通过，准备构建数据包...", values);
                
                // 此处可以接入真实的 AJAX (Fetch/XHR) 将 values 提交到服务器
                // form.submit(); // 如果需要传统原生提交，可以取消这行注释
            }
        });

        /**
         * 交互优化：监听重置按钮的 click/reset 事件
         */
        form.addEventListener('reset', function() {
            // 当原生重置被触发时，除了清空 value 外，还需手动清空我们自定义的红色边框等错误样式
            clearAllErrors();
        });

        /**
         * 交互优化：用户在修改输入框时，即时隐藏该输入框的错误提示
         * 提升用户体验，不让红色错误一直挂在页面上
         */
        Object.keys(inputs).forEach(key => {
            inputs[key].addEventListener('input', () => {
                clearError(key);
            });
        });

    </script>
</body>
</html>
