<html>
<head>
    <title>Test 2</title>
</head>
<body>
    <form action = "test_2.html">
        <img src = "zwu_logo.jpg" width = "200px" height = "100px"></img><br><br>
        <label for="name">用户名:</label>
        <input type="text" id="name" name="name"></input><br><br>
        <label for="password">密码:</label>
        <input type="password" name="password"></input><br><br>
        <label for="gender">性别:</label>
        <input type="radio" name="gender" value="男">男</input>
        <input type="radio" name="gender" value="女">女</input><br><br>
        <label for="hobby">爱好:</label>
        <input type="checkbox" name="hobby" value="篮球">篮球</input>
        <input type="checkbox" name="hobby" value="足球">足球</input>
        <input type="checkbox" name="hobby" value="游泳">游泳</input>
        <input type="checkbox" name="hobby" value="网球">网球</input><br><br>
        <label for="city">城市:</label>
        <select name="city" size = "3">
            <option value="beijing">北京</option>
            <option value="shanghai">上海</option>
            <option value="guangzhou">广州</option>
            <option value="shenzhen">深圳</option>
            <option value="ningbo">宁波</option>
        </select><br><br>
        <input type="submit" value="提交"></input>
        <input type="reset" value="重置"></input><br><br>
        <div style="text-align: left;"><a href="profile.html">上一页</a></div>
    </form>
</body>
</html>
